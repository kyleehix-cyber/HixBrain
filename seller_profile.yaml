# Seller profile. The brief uses this to explain why THIS account should buy
# Deepgram. Case-study figures were gathered from search results about
# deepgram.com/customers on 2026-10-05; re-check the linked page before
# quoting a number to a customer.

seller:
  name: Kyle Hix
  company: Deepgram
  product: >
    Deepgram voice AI platform. Nova (speech-to-text), Aura (text-to-speech), and the
    Voice Agent API (STT + LLM orchestration + TTS in one real-time stack, bring-your-own
    LLM/TTS supported). Deploys as cloud, VPC, or on-prem. Sold direct to enterprises and
    their developers, and embedded in CCaaS / conversational AI platforms.
  customers_page: https://deepgram.com/customers

value_props:
  - Accuracy where it matters for self-service. Names, account numbers, alphanumerics, accents, and noisy audio are where IVAs fail and calls escape to agents.
  - Real-time latency fast enough for natural voice agents (barge-in, turn-taking), not press-1 IVR.
  - Lower cost at scale than hyperscaler speech APIs, which matters at millions of calls per year.
  - One stack for the whole call (voice agent, agent assist, transcription, post-call analytics) instead of separate vendors.
  - Deploy anywhere. Cloud, VPC, or on-prem for regulated data (HIPAA, PCI, banking), plus custom-trained models for domain vocabulary.
  - Works with the stack they already own. Powers or integrates with Five9, Amazon Connect, Twilio, Genesys, Cognigy, Kore.ai, and others, with Salesforce / ServiceNow / proprietary CRM through the agent's tool calls.

ideal_customer:
  inbound_volume: High inbound call volume (rule of thumb 250+ frontline agents or 1M+ calls/year), OR a product/engineering team building voice features
  industries:
    - Healthcare (payers, providers, pharmacy)
    - Insurance
    - Banking, credit unions, lending, collections
    - Restaurants / QSR drive-thru and phone ordering
    - Utilities and energy
    - Telecom and cable
    - Travel and hospitality
    - Retail and e-commerce
    - BPOs and answering services
    - Software companies building voice products (CCaaS, conversation intelligence, voice-agent startups)
  public_or_private: both

buyer_personas:
  - title: Chief Experience Officer / Chief Customer Officer
    role: economic buyer or executive sponsor (containment, CSAT, cost to serve)
  - title: CIO
    role: approver. Vendor strategy, security, data residency, cost vs. hyperscaler speech.
  - title: CTO
    role: technical approver and often the economic buyer for build-on-Deepgram. Latency, accuracy, deployment model.
  - title: Product Manager (digital, CX, conversational, or voice product)
    role: champion. Owns the voice agent / IVA roadmap and the intents to automate.
  - title: Contact Center Manager / VP or Director of Contact Center Operations
    role: champion and end user. Containment, AHT, authentication rate, QA coverage.
  - title: Engineering lead / ML or voice engineer
    role: technical evaluator who runs the benchmark. Win them with a bake-off on THEIR audio.

