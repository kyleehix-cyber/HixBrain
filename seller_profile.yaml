objections:
  "We already have an IVR / our CCaaS vendor has AI": >
    Good. Five9, Amazon Connect, Twilio, and Genesys work with Deepgram, so this can be an upgrade of the speech
    layer inside the platform they own, not a rip-and-replace. Ask what their IVA's authentication and containment
    rates are today. Speech errors on names, IDs, and accents are the usual reason calls escape to agents.
  "We're standardized on Google / Microsoft / AWS speech": >
    Offer a bake-off on their own call recordings: accuracy on their vocabulary and alphanumerics, latency, and cost
    per hour at their volume. Deepgram can run in their VPC, so data never leaves their cloud.
  "We're building it ourselves on LLM APIs": >
    Great. That's exactly who the Voice Agent API is for. Bring your own LLM and keep control of the logic. Deepgram
    handles the hard real-time speech layer (latency, barge-in, accuracy, TTS).
  "Customers hate talking to bots": >
    They hate being misunderstood. Accurate, low-latency speech is what makes a voice agent feel natural. Design an
    instant escape to a human with context passed along.
  "Compliance / data residency (HIPAA, PCI, banking)": >
    VPC and on-prem deployment, so audio stays in their environment. Elerian AI is a banking on-prem reference.
  "No budget this year": >
    Frame it as cost takeout: agent minutes saved, or speech-API spend saved vs. a hyperscaler at their volume. It often
    lands in an existing CCaaS or platform budget line when bought through a partner.
