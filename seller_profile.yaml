# Seller profile — the brief uses this to explain why THIS account should buy
# what YOU sell. Fill in the TODOs; everything else is a solid default for a
# Conversational AI / Voice AI platform seller.

seller:
  name: Kyle Hix
  company: TODO            # your company name
  product: Conversational AI and Voice AI platform — AI agents that answer, resolve, and route inbound calls and chats, integrated with the CRM and contact-center stack.

value_props:
  - Containment / deflection — resolve routine inbound calls end-to-end without a human (status, billing, scheduling, password reset, order changes).
  - Lower cost to serve — fewer agent minutes per contact; AI-handled calls cost a fraction of a human-handled call.
  - Shorter hold times and 24/7 coverage — instant answer, no queue, after-hours and spike coverage (storms, outages, open enrollment, holidays).
  - Better agent experience — warm handoff with full context into Salesforce / ServiceNow; summaries and disposition written back automatically.
  - Faster time to value than legacy IVR rebuilds — natural-language replaces press-1 menus without ripping out the CCaaS platform.

