objections:     # objection -> best response (edit to match your product)
  "We already have an IVR / our CCaaS vendor has AI": >
    Keep the CCaaS platform; we work alongside it. The question is containment rate. Ask what percentage of calls
    their current IVA fully resolves. Most press-1 and first-gen IVAs land well under 20%.
  "Customers hate talking to bots": >
    They hate menus and hold queues. Show a live demo and CSAT on AI-handled calls, and design an
    instant escape-to-human with context passed along.
  "AI hallucination / compliance risk (HIPAA, PCI, TCPA)": >
    Guardrailed, grounded responses; PCI-safe payment capture; PHI handling; audit logs; SOC 2 / HIPAA BAA. Bring security in early.
  "We're building it ourselves on LLM APIs": >
    Telephony latency, barge-in, turn-taking, CRM write-back, analytics, and ongoing tuning are the hard 80%.
    Compare total cost of ownership and time to production.
  "No budget this year": >
    Frame it as cost takeout: agent minutes saved × cost per minute. Often funded from the operations budget or BPO savings.
  "Integration with our CRM will be a nightmare": >
    Pre-built connectors for Salesforce and ServiceNow; REST/webhook layer for proprietary CRMs; start with read-only lookups.
